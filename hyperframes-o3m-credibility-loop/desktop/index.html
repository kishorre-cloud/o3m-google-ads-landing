    <script>
      const tl = gsap.timeline({ paused: true });
      const root = document.getElementById("root");
      const W = 1920, H = 240;
      const lmEl = document.querySelector(".lm-wrap");
      // Ribbons keep to the open bands above and below the words, and cross over each other only
      // behind the landmark illustration, so they never pass through text.
      function lane(x0, x1, y, step, jog) {
        const pts = [];
        for (let x = x0, i = 0; x < x1 - step * 0.4; x += step, i++) pts.push([x, y + (i % 2 ? jog : -jog)]);
        return pts;
      }
      function ribbons() {
        const r = lmEl.getBoundingClientRect(), s = root.getBoundingClientRect().width / W || 1;
        const lx = (r.left - root.getBoundingClientRect().left) / s, lw = r.width / s;
        const c0 = lx + lw * 0.12, c1 = lx + lw * 0.88, mid = (c0 + c1) / 2;
        const A = lane(-160, c0, 206, 250, 7).concat([[c0, 206], [mid, 120], [c1, 34]], lane(c1 + 250, W + 160, 34, 250, 7), [[W + 160, 34]]);
        const B = lane(-160, c0, 34, 250, 7).concat([[c0, 34], [mid, 120], [c1, 206]], lane(c1 + 250, W + 160, 206, 250, 7), [[W + 160, 206]]);
        const off = (pts, lo, hi) => pts.map((q) => [q[0], q[1] + (q[1] > 120 + 10 ? lo : q[1] < 120 - 10 ? hi : 0)]);
        return { A: A, B: B, At: off(A, 13, -13), Bt: off(B, 13, -13) };
      }
      const $ = (id) => document.getElementById(id);
      O3MLoop.emphasis(tl, root);
      O3MLoop.ambient(tl, {
        lanes: ribbons,
        ribbons: [
          { el: [$("rgA"), $("rA"), $("tgA"), $("trA")], lane: "A", amp: 7, waves: 3, phase: 0 },
          { el: [$("rgB"), $("rB"), $("tgB"), $("trB")], lane: "B", amp: 7, waves: 2, phase: 2.1 },
          { el: [$("rtA")], lane: "At", amp: 5, waves: 3, phase: 0.8 },
          { el: [$("rtB")], lane: "Bt", amp: 5, waves: 2, phase: 2.9 }
        ],
        trails: [{ el: $("trA"), phase: 0 }, { el: $("tgA"), phase: 0 }, { el: $("trB"), phase: 0.5 }, { el: $("tgB"), phase: 0.5 }],
        particles: [
          { el: $("p1"), ribbon: 0, phase: 0.02, alpha: 0.95 }, { el: $("p2"), ribbon: 0, phase: 0.38, alpha: 0.8 }, { el: $("p3"), ribbon: 0, phase: 0.7, alpha: 0.9 },
          { el: $("p4"), ribbon: 1, phase: 0.2, alpha: 0.8 }, { el: $("p5"), ribbon: 1, phase: 0.55, alpha: 0.9 }, { el: $("p6"), ribbon: 1, phase: 0.86, alpha: 0.9 }
        ],
        glows: [{ el: $("gB"), dx: 40, dy: 6, phase: 0 }, { el: $("gG"), dx: 40, dy: 6, phase: 3.1 }]
      });
      window.__timelines["main"] = tl;
