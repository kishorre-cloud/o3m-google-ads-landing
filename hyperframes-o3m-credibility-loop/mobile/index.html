    <script src="assets/loop.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      const root = document.getElementById("root");
      const W = 1080, H = 540;
      const lmEl = document.querySelector(".lm-wrap");
      // Ribbons keep to the open bands above and below the words, and cross over each other only
      // behind the landmark illustration, so they never pass through text.
      function lane(x0, x1, y, step, jog) {
        const pts = [];
        for (let x = x0, i = 0; x < x1 - step * 0.4; x += step, i++) pts.push([x, y + (i % 2 ? jog : -jog)]);
        return pts;
      }
      function ribbons() {
        const r = lmEl.getBoundingClientRect(), s = root.getBoundingClientRect().width / W || 1;
        const lx = (r.left - root.getBoundingClientRect().left) / s, lw = r.width / s;
        const c0 = lx + lw * 0.05, c1 = lx + lw * 0.95, mid = (c0 + c1) / 2;
        const A = lane(-160, c0, 372, 200, 6).concat([[c0, 372], [mid, 278], [c1, 184]], lane(c1 + 200, W + 160, 184, 200, 6), [[W + 160, 184]]);
        const B = lane(-160, c0, 184, 200, 6).concat([[c0, 184], [mid, 278], [c1, 372]], lane(c1 + 200, W + 160, 372, 200, 6), [[W + 160, 372]]);
        const off = (pts, lo, hi) => pts.map((q) => [q[0], q[1] + (q[1] > 278 + 10 ? lo : q[1] < 278 - 10 ? hi : 0)]);
        return { A: A, B: B, At: off(A, 11, -11), Bt: off(B, 11, -11) };
      }
      const $ = (id) => document.getElementById(id);
      O3MLoop.emphasis(tl, root);
      O3MLoop.ambient(tl, {
        lanes: ribbons,
        ribbons: [
          { el: [$("rgA"), $("rA"), $("tgA"), $("trA")], lane: "A", amp: 6, waves: 3, phase: 0 },
          { el: [$("rgB"), $("rB"), $("tgB"), $("trB")], lane: "B", amp: 6, waves: 2, phase: 2.1 },
          { el: [$("rtA")], lane: "At", amp: 4, waves: 3, phase: 0.8 },
          { el: [$("rtB")], lane: "Bt", amp: 4, waves: 2, phase: 2.9 }
        ],
        trails: [{ el: $("trA"), phase: 0 }, { el: $("tgA"), phase: 0 }, { el: $("trB"), phase: 0.5 }, { el: $("tgB"), phase: 0.5 }],
        particles: [
          { el: $("p1"), ribbon: 0, phase: 0.02, alpha: 0.95 }, { el: $("p2"), ribbon: 0, phase: 0.38, alpha: 0.8 }, { el: $("p3"), ribbon: 0, phase: 0.7, alpha: 0.9 },
          { el: $("p4"), ribbon: 1, phase: 0.2, alpha: 0.8 }, { el: $("p5"), ribbon: 1, phase: 0.55, alpha: 0.9 }, { el: $("p6"), ribbon: 1, phase: 0.86, alpha: 0.9 }
        ],
        glows: [{ el: $("gB"), dx: 30, dy: 6, phase: 0 }, { el: $("gG"), dx: 30, dy: 6, phase: 3.1 }]
      });
      window.__timelines["main"] = tl;
    </script>
